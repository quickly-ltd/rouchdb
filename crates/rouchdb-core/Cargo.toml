[package]
name = "rouchdb-core"
description = "Core types, traits, and algorithms for RouchDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[features]
# serde_json's `arbitrary_precision`: numbers keep the text they were written
# with. Collation reads the mode at run time, so it also follows a build that
# turns `arbitrary_precision` on through another crate. `rouchdb` forwards its
# own `arbitrary-precision` feature here.
arbitrary-precision = ["serde_json/arbitrary_precision"]

[dependencies]
async-trait = "0.1.68"
base64 = "0.22.1"
md-5 = "0.10"
serde = { version = "1.0.185", features = ["derive"] }
serde_json = { version = "1.0.106", features = ["unbounded_depth"] }
thiserror = "2"
tokio = { version = "1.37", features = ["sync"] }

[dev-dependencies]
tokio = { version = "1.37", features = ["macros", "rt-multi-thread"] }
proptest = { version = "1", default-features = false, features = ["std"] }
