[package]
name = "rouchdb-adapter-http"
description = "CouchDB HTTP client adapter for RouchDB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
rouchdb-core = { path = "../rouchdb-core", version = "0.4.0" }
async-trait = "0.1"
percent-encoding = "2"
# `default-features = false` is deliberate. reqwest's default feature set turns
# on `default-tls`, which resolves to native-tls and drags in openssl-sys — a
# system C dependency that breaks cross-compilation (Android/iOS) and is pulled
# into every downstream binary through Cargo's feature unification, overriding
# whatever TLS backend the consumer selected. rustls-tls keeps the adapter pure
# Rust. `http2` is likewise left off: CouchDB speaks HTTP/1.1 and the h2 flow
# control window adds no value here.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "cookies",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
